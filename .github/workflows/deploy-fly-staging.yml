name: Deploy to Fly.io (staging)

# Auto-deploys the STAGING app on every push to the staging branch that
# touches server/, client/, or the deploy config itself - a parallel
# environment to deploy-fly.yml (production, main branch only), pointed at
# a separate Fly app and separate data volume via fly.staging.toml so
# nothing here can ever touch real production data.
#
# Requires a FLY_STAGING_API_TOKEN secret on this repo (Settings -> Secrets
# and variables -> Actions), generated from a deploy token scoped to the
# staging Fly app - see fly.staging.toml's header comment for the full
# one-time setup steps (creating the app, volume, custom domain, and this
# token).
#
# Workflow: push/merge into `staging` to deploy and review changes at
# dev.poolmanager.cuesense.co.uk; once approved, merge `staging` into
# `main` to promote the same changes to the live app.
on:
  push:
    branches: [staging]
    paths:
      - 'client/**'
      - 'server/**'
      - 'Dockerfile'
      - 'fly.staging.toml'
      - '.github/workflows/deploy-fly-staging.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io (staging)
    runs-on: ubuntu-latest
    concurrency: deploy-staging-group # avoid two staging deploys racing if pushes land close together
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_STAGING_API_TOKEN }}
