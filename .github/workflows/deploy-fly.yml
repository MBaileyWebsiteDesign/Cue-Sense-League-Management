name: Deploy to Fly.io

# Auto-deploys the live app on every push to main that touches server/,
# client/, or the deploy config itself - separate from deploy-demo.yml,
# which only builds the static GitHub Pages demo build. Requires a
# CUESENSELEAGUEMANAGEMENT secret on this repo (Settings -> Secrets and variables ->
# Actions) generated from a Fly.io deploy token - see fly.toml's header
# comment and the project README for full one-time setup steps.
on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'Dockerfile'
      - 'fly.toml'
      - '.github/workflows/deploy-fly.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency: deploy-group # avoid two deploys racing if pushes land close together
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Push the MailerSend API key (GitHub Actions secret) to the Fly app as a runtime
      # secret. Staged, so it applies with the deploy below. Skipped if the GitHub secret
      # isn't set. Not fatal: a failure here only means email stays off; check the log.
      - name: Sync MailerSend secrets to Fly
        run: |
          if [ -n "$MAILERSEND_API_KEY" ]; then
            flyctl secrets set --stage MAILERSEND_API_KEY="$MAILERSEND_API_KEY" \
              || echo "::warning::Could not set MAILERSEND_API_KEY on Fly - email will stay disabled"
          else
            echo "::warning::MAILERSEND_API_KEY GitHub secret not set - email disabled"
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.CUESENSELEAGUEMANAGEMENT }}
          MAILERSEND_API_KEY: ${{ secrets.MAILERSEND_API_KEY }}
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.CUESENSELEAGUEMANAGEMENT }}
