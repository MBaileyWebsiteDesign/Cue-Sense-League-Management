# Static hosting for the Top Spin website on Fly.io (see fly.toml).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
  gzip_min_length 512;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  # Old Wix page addresses (for when the real domain moves here).
  location = /book-online { return 301 /book.html; }
  location = /menus { return 301 /food-drink.html; }
  location = /pool-services { return 301 /cue-care.html; }
  location = /Tournaments { return 301 /leagues.html; }
  location = /about-us { return 301 /about.html; }

  location = /healthz { access_log off; return 200 "ok\n"; }

  location ~* \.(?:jpg|jpeg|png|webp|gif|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }
  location ~* \.(?:css|js)$ {
    expires 1h;
    try_files $uri =404;
  }
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
  error_page 404 /404.html;
}
