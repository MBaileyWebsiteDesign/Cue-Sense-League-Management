# Fly.io app config for The Ultimate Pool League.
#
# IMPORTANT - before your first deploy:
# 1. Change `app` below to a globally-unique name (or just run `fly launch`
#    in this directory - it will detect the Dockerfile, ask you for a name,
#    and rewrite this file for you; re-add the [[mounts]] block below
#    afterwards if `fly launch` drops it).
# 2. Create the persistent volume the [[mounts]] block references, in the
#    same region as `primary_region`:
#      fly volumes create pool_league_data --region iad --size 1
#    (1 GB is enormous overkill for this JSON file - it's just Fly's
#    minimum billing unit.)
# 3. Run `fly deploy` once by hand the first time so the app + volume exist
#    before GitHub Actions takes over automatic deploys on every push.

app = "the-ultimate-pool-league"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    protocol = "http"
    timeout = "3s"

# Persists server/src/data/db.json (the whole app's database) across
# deploys and restarts - without this, every deploy would wipe every
# league, user account, and result back to empty.
[[mounts]]
  source = "pool_league_data"
  destination = "/app/server/src/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
