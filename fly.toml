# fly.toml app configuration file for the LIVE (production) app.
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'cuesense-pool-manager'
primary_region = 'lhr'

[build]

[env]
  DATA_DIR = '/data'

[[mounts]]
  source = 'pool_league_data'
  destination = '/data'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[restart]]
  policy = 'always'
  retries = 10
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
