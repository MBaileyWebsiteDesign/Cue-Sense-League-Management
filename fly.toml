# fly.toml app configuration file generated for cue-sense-pool-management on 2026-08-05T05:41:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cue-sense-pool-management'
primary_region = 'iad'

[build]

[env]
  DATA_DIR = '/data'

[[mounts]]
  source = 'pool_league_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
