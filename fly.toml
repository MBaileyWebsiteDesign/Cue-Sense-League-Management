# fly.toml app configuration file generated for the-ultimate-pool-league on 2026-07-30T16:46:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'the-ultimate-pool-league'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = "pool_league_data"
  destination = "/data"

[env]
  DATA_DIR = "/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
