# fly.toml app configuration file generated for cue-sense-league-management on 2026-08-25T12:06:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cue-sense-league-management'
primary_region = 'lhr'

[build]

[env]
  DATA_DIR = '/data'

[[mounts]]
  source = 'pool_league_data'
  destination = '/data'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[restart]]
  policy = 'on-failure'
  retries = 10
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
