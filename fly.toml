# fly.toml app configuration file generated for cuesense-pool-manager-staging on 2026-08-05T07:30:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cuesense-pool-manager-staging'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[restart]]
  policy = 'always'
  processes = ['app']
  retries = 10
