# fly.toml app configuration file for the STAGING environment.
#
# Mirrors fly.toml (production) exactly except for the app name and the
# volume it mounts - staging gets its own separate Fly app and its own
# separate persistent volume, so nothing staging does can ever touch
# production's real league/player data. See the "Staging environment"
# section of the README (or task #74/#88 notes) for the one-time setup
# steps this config depends on (creating the app + volume + custom domain
# + FLY_STAGING_API_TOKEN secret via flyctl).
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'cuesense-pool-manager-staging'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = "pool_league_data_staging"
  destination = "/data"

[env]
  DATA_DIR = "/data"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
